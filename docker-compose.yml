name: olist                                    # préfixe des conteneurs, volumes et réseau

# Profils : quoi démarrer, et quand
#   core           toujours        pg13, pg16, source-api                               make up
#   lineage        traçabilité     marquez, marquez-web                                 make lineage-up
#   observability  surveillance    prometheus, cadvisor, exporters, grafana, mailpit    make obs-up
#   pilotage       scénarios       runner, streamlit (+ mailpit pour les récaps)        make pilotage-up
# Les trois derniers dépendent de pg16 ou pg13 (profil core) : on les lance donc toujours AVEC
# --profile core, ce que font les cibles make. Un --profile en ligne de commande remplace
# COMPOSE_PROFILES du .env, il ne s'y ajoute pas.
# Dans le réseau Docker, un service se joint par son nom et son port interne (pg16:5432).
# localhost, dans un conteneur, c'est le conteneur lui-même.

services:
  # ---------- Fournisseur simulé : PostgreSQL 13 ----------
  pg13:
    image: ${PG13_IMAGE}
    container_name: pg13
    environment:
      POSTGRES_DB: ${SOURCE_DB}
      POSTGRES_USER: ${SOURCE_USER}
      POSTGRES_PASSWORD: ${SOURCE_PASSWORD}
    ports:
      - "${SOURCE_PORT}:5432"                  # ta machine:5433 -> conteneur:5432
    volumes:
      - pg13_data:/var/lib/postgresql/data     # les données survivent à un redémarrage
      - ./srv-source/db/init:/docker-entrypoint-initdb.d:ro   # exécuté SEULEMENT si le volume est vide
    healthcheck:                               # « healthy » quand PostgreSQL accepte les connexions
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: [core]

  # ---------- Entrepôt : PostgreSQL 16 ----------
  pg16:
    image: ${PG16_IMAGE}
    container_name: pg16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB}
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
    ports:
      - "${WAREHOUSE_PORT}:5432"
    volumes:
      - pg16_data:/var/lib/postgresql/data
    shm_size: 256mb                            # 64 Mo par défaut : trop juste pour les requêtes parallèles
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: [core]

  # ---------- API du fournisseur (construite à l'étape 5) ----------
  source-api:
    build:
      context: .                               # racine : le Dockerfile a besoin de pyproject.toml et uv.lock
      dockerfile: srv-source/api/Dockerfile
    container_name: source-api
    environment:
      # Dans le réseau Docker, la base s'appelle pg13 et écoute sur 5432 (pas localhost:5433)
      SOURCE_DSN: postgresql://${SOURCE_USER}:${SOURCE_PASSWORD}@pg13:5432/${SOURCE_DB}
      CHAOS_RATE: ${CHAOS_RATE}
    ports:
      - "8000:8000"
    depends_on:
      pg13:
        condition: service_healthy             # attend que la base soit prête, pas seulement lancée
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [core]

  # ---------- Traçabilité : API et interface Marquez (profil lineage) ----------
  # Pas de conteneur marquez-db : Marquez range ses tables dans la base « marquez » du pg16
  # existant (même image, même volume). make marquez-db crée cette base et son rôle.
  marquez:
    image: marquezproject/marquez:${MARQUEZ_VERSION:-0.51.1}
    container_name: marquez
    environment:
      MARQUEZ_CONFIG: /usr/src/app/marquez.yml   # notre fichier : le marquez.dev.yml de l'image fige marquez/marquez
      MARQUEZ_PORT: 5000                         # ports DANS le conteneur
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: pg16                        # nom du service : le réseau Docker du projet le résout
      POSTGRES_PORT: 5432                        # port interne de pg16, pas celui publié sur ta machine
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD:-}  # vide par défaut : make lineage-up refuse de démarrer sans
    volumes:
      - ./lineage/marquez.yml:/usr/src/app/marquez.yml:ro
    ports:
      - "${MARQUEZ_API_PORT:-5000}:5000"         # API : reçoit les événements de dbt-ol
      - "5001:5001"                              # santé et métriques
    depends_on:
      pg16:
        condition: service_healthy
    healthcheck:                                 # l'image a bash mais pas forcément curl
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5001"]
      interval: 10s
      timeout: 3s
      retries: 30                                # les migrations du premier démarrage prennent du temps
    profiles: [lineage]

  marquez-web:
    image: marquezproject/marquez-web:${MARQUEZ_VERSION:-0.51.1}
    container_name: marquez-web
    environment:
      MARQUEZ_HOST: marquez                      # l'interface relaie /api/v1 vers ce service
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000                             # obligatoire : sans elle, le serveur de l'interface s'arrête
    ports:
      - "${MARQUEZ_WEB_PORT:-3000}:3000"
    depends_on:
      marquez:
        condition: service_healthy
    profiles: [lineage]

  # ---------- Surveillance (profil observability) ----------
  # Avant le premier démarrage : make obs-roles (rôles monitor et grafana_ro). make obs-up le fait.
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}       # version épinglée dans .env
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d              # garde 15 jours d'historique
      - --web.enable-lifecycle                         # autorise le rechargement à chaud
    # root : docker.sock appartient à root:1001 (droits 660), l'utilisateur nobody de l'image ne peut pas le lire
    user: root
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro  # configuration en lecture seule
      - prometheus_data:/prometheus                    # données qui survivent au redémarrage
      # Découverte Docker (job docker-names) : relie l'id de chaque conteneur à son nom de service.
      # Sous Docker Desktop, cAdvisor ne voit les conteneurs que par leur id (/docker/<id>).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["9090:9090"]
    profiles: [observability]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    privileged: true                         # accès aux cgroups du noyau
    devices: ["/dev/kmsg"]                   # événements noyau (OOM kill, par exemple)
    volumes:                                 # tout en lecture seule
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports: ["8080:8080"]                     # interface web de cAdvisor
    profiles: [observability]

  # Un exporter par serveur PostgreSQL, avec le rôle dédié monitor (membre de pg_monitor)
  pg16-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION}
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:${PG16_MONITOR_PASSWORD}@pg16:5432/${WAREHOUSE_DB}?sslmode=disable"
    depends_on:
      pg16:
        condition: service_healthy
    profiles: [observability]

  pg13-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION}
    environment:
      DATA_SOURCE_NAME: "postgresql://monitor:${PG13_MONITOR_PASSWORD}@pg13:5432/${SOURCE_DB}?sslmode=disable"
    depends_on:
      pg13:
        condition: service_healthy
    profiles: [observability]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    environment:                                   # GF_<SECTION>_<CLÉ> remplace grafana.ini
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/olist-pilotage.json   # page d'accueil
      GF_SMTP_ENABLED: "true"                      # active l'envoi d'e-mails
      GF_SMTP_HOST: mailpit:1025                   # serveur SMTP local
      GF_SMTP_FROM_ADDRESS: grafana@olist.test
      GF_SMTP_SKIP_VERIFY: "true"                  # Mailpit n'a pas de certificat TLS
      PG16_GRAFANA_PASSWORD: ${PG16_GRAFANA_PASSWORD}   # lue par le fichier de sources
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana              # utilisateurs, préférences, historique
    ports: ["3001:3000"]                           # 3000 est déjà pris par l'interface Marquez
    depends_on: [prometheus, mailpit]
    profiles: [observability]

  # Faux serveur SMTP : Grafana (alertes) et le runner (récaps) y envoient leurs e-mails
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    ports: ["8025:8025"]          # interface web ; le SMTP (1025) reste interne au réseau Docker
    profiles: [observability, pilotage]

  # ---------- Pilotage : runner et console Streamlit (profil pilotage) ----------
  runner:
    build:
      context: .                               # racine : le runner embarque ingestion, dbt et le générateur
      dockerfile: runner/Dockerfile
    container_name: runner
    env_file: .env                             # mots de passe, SCALE, CHAOS_RATE, DUCKDB_PATH…
    environment:
      # Le .env vise localhost (commandes lancées depuis VS Code). Ici on est DANS le réseau
      # Docker : mêmes variables, réécrites avec les noms de service. environment l'emporte sur env_file.
      PG16_RUNNER_URL: postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@pg16:5432/${WAREHOUSE_DB}
      WAREHOUSE_DSN: postgresql://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@pg16:5432/${WAREHOUSE_DB}
      WAREHOUSE_HOST: pg16                     # lu par dbt/profiles.yml
      WAREHOUSE_PORT: "5432"                   # port interne, pas celui publié sur ta machine
      SOURCE_DSN: postgresql://${SOURCE_USER}:${SOURCE_PASSWORD}@pg13:5432/${SOURCE_DB}
      SOURCE_API_URL: http://source-api:8000
      OPENLINEAGE_URL: http://marquez:5000     # dbt-ol ; Marquez éteint : avertissement, le run continue
      OPENLINEAGE_NAMESPACE: ${OPENLINEAGE_NAMESPACE:-olist}
      DBT_USE_COLORS: "false"                  # pas de codes couleur ANSI dans la console Streamlit
      TQDM_DISABLE: "1"                        # pas de barre de progression dbt-ol (une ligne de log par tick)
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Liens du récap e-mail : ouverts par TON navigateur, donc localhost et les ports publiés
      STREAMLIT_PUBLIC_URL: http://localhost:8501
      GRAFANA_PUBLIC_URL: http://localhost:3001/d/olist-pilotage
      MARQUEZ_PUBLIC_URL: http://localhost:${MARQUEZ_WEB_PORT:-3000}
    volumes:
      - ./data/duckdb:/app/data/duckdb         # le runner publie mart.duckdb ici
    depends_on:
      pg16:
        condition: service_healthy
      source-api:
        condition: service_healthy             # l'ingestion lit la source par l'API
      mailpit:
        condition: service_started
    healthcheck:                               # /metrics répond dès que uvicorn et le worker tournent
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [pilotage]

  # Console des scénarios. Pour la développer avec rechargement à chaud, ne lance que le runner
  # dans Docker et Streamlit sur ta machine : les deux veulent le port 8501.
  streamlit:
    build: ./streamlit                         # contexte = streamlit/ (Dockerfile, app.py, requirements.txt)
    container_name: streamlit
    environment:                               # rôle streamlit_app : lit obs, dépose des demandes, rien d'autre
      PG16_STREAMLIT_URL: postgresql://streamlit_app:${PG16_STREAMLIT_PASSWORD}@pg16:5432/${WAREHOUSE_DB}
      MARQUEZ_PUBLIC_URL: http://localhost:${MARQUEZ_WEB_PORT:-3000}
    ports: ["8501:8501"]
    depends_on:
      pg16:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [pilotage]

volumes:
  pg13_data:
  pg16_data:
  prometheus_data:
  grafana_data:
