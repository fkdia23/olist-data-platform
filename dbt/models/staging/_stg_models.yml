# dbt/models/staging/_stg_models.yml
models:
  - name: stg_orders
    description: "Commandes nettoyées. Grain : une ligne par order_id."
    columns:
      - name: order_id
        data_tests:
          - unique                              # test natif : aucun doublon
          - not_null                            # test natif : aucune valeur vide
      - name: customer_id
        data_tests:
          - relationships:                      # intégrité référentielle
              arguments:
                to: ref('stg_customers')        # chaque client cité doit exister…
                field: customer_id              # … dans cette colonne
      - name: status
        data_tests:
          - accepted_values:                    # liste fermée de valeurs
              arguments:
                values: ['created', 'approved', 'invoiced', 'processing',
                         'shipped', 'delivered', 'canceled', 'unavailable']
              config:
                severity: warn                  # une nouvelle valeur mérite un regard, pas un arrêt

  - name: stg_order_items
    description: "Articles de commande nettoyés. Grain : une ligne par (order_id, order_item_id)."
    config:
      contract:
        enforced: true                    # dbt refuse de construire si colonnes ou types diffèrent
    data_tests:
      - dbt_utils.unique_combination_of_columns:   # le grain : jamais deux fois le même article
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        data_type: text
        description: "Commande à laquelle appartient l'article."
        data_tests:
          - not_null
          - relationships:                # chaque article pointe vers une commande connue
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        data_type: integer
        description: "Rang de l'article dans la commande (1, 2, 3…)."
        data_tests:
          - not_null
      - name: product_id
        data_type: text
        data_tests:
          - not_null
      - name: seller_id
        data_type: text
        data_tests:
          - not_null
      - name: shipping_limit_at
        data_type: timestamp
        description: "Date limite de remise au transporteur."
      - name: price
        data_type: numeric(10,2)
        description: "Prix de l'article, hors frais de port."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true            # 0 exclu : un article à 0 € est suspect
              config:
                severity: warn            # signale sans bloquer : la règle métier est dans int_
                store_failures: true      # lignes fautives gardées dans le schéma audit
      - name: freight_value
        data_type: numeric(10,2)
        description: "Frais de port de l'article."
      - name: _ingested_at
        data_type: timestamp with time zone
        description: "Moment où la ligne est arrivée dans raw (défaut now() en base)."

  - name: stg_order_reviews
    columns:
      - name: review_score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1                    # notes valides : 1 à 5 inclus
                max_value: 5
              config:
                severity: warn
                store_failures: true