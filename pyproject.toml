[project]
name = "olist-data-platform"
version = "0.1.0"
description = "Plateforme de données Olist : sources simulées, ingestion, qualité, observabilité"
requires-python = ">=3.12"
# Dépendances communes à tous les composants Python
dependencies = [
    "pydantic>=2.7",               # contrats de données
    "psycopg[binary,pool]>=3.2",   # pilote PostgreSQL, avec pool de connexions
    "sqlalchemy>=2.0",             # utilisé par Alembic
    "alembic>=1.20.1",
    "tenacity>=9.2.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
# Outils de développement : jamais installés dans les images Docker
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "httpx>=0.28.1",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]
# Ingestion : migrations, client HTTP, nouvelles tentatives
ingestion = ["alembic>=1.13", "httpx>=0.27", "tenacity>=9"]
# API source
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "prometheus-fastapi-instrumentator>=7"]
transformation = [
    "dbt-core>=1.11,<2.0",
    "dbt-duckdb>=1.11.1",
    "dbt-postgres>=1.11.0",
    "openlineage-dbt>=1.55.0",
]
runner = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "prometheus-client>=0.20",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false            # projet d'application : rien à publier sur PyPI

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # erreurs, imports, bugs probables, syntaxe moderne

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # rend contracts/ et ingestion/ importables dans les tests
markers = ["integration: tests qui demandent les bases Docker démarrées"]
addopts = "-m 'not integration'"   # make test reste rapide ; make test-integration lance les autres
